# Prometheus configuration for the DOCKER option.
# Inside the container, "localhost" is the container itself - the demo's
# /metrics endpoint runs on the HOST, reached via host.docker.internal.
# (On Linux, also run the demo with --metrics-host 0.0.0.0.)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "adp-paths"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "adp-paths"
          environment: "demo"
